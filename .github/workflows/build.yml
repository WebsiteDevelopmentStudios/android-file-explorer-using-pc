name: Build Executable

on:
  push:
    branches: [ "main" ] # Triggers the worker whenever you push code to main
  workflow_dispatch:      # Allows you to manually click "Run workflow" on GitHub

jobs:
  build:
    runs-on: windows-latest # Tells GitHub to use a Windows worker machine

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --add-data "adb.exe;." --add-data "AdbWinApi.dll;." --add-data "AdbWinUsbApi.dll;." --add-data "fastboot.exe;." --add-data "xplorer.exe;." android_manager.py

    - name: Upload Finished EXE as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android_manager_tool
        path: dist/android_manager.exe
